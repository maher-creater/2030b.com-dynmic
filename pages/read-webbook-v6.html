<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Read · v6 Theatre · 2030B WebBook</title>
<meta name="author" content="Maher" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{ink:{900:'#08070f',950:'#04030a'},gold:{300:'#f5e6b3',400:'#fbbf24',500:'#d4a857'}},fontFamily:{sans:['Inter','sans-serif'],display:['Cormorant Garamond','serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css" />
<style>
/* v6 — THEATRE: a cinematic, framed presentation. Iframe in a centred card.
   The "stage" is dark; the "audience" is the page; tabs run along the bottom. */
html,body{background:#04030a;min-height:100vh;margin:0;color:#f5e6b3}
.th-shell{min-height:100vh;display:flex;flex-direction:column}
.th-top{padding:.6rem 1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(212,168,87,.12)}
.th-stage{
  flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:radial-gradient(ellipse at center, rgba(212,168,87,.06), transparent 60%);
}
.th-card{
  width:100%;max-width:1200px;aspect-ratio:16/10;
  border-radius:1.2rem;overflow:hidden;
  border:1px solid rgba(212,168,87,.3);
  box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(212,168,87,.15),0 0 80px rgba(212,168,87,.08);
  background:#0c0a1a;display:flex;flex-direction:column;
}
.th-card-bar{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;border-bottom:1px solid rgba(212,168,87,.2);background:#08070f}
.th-card-bar .dot{width:9px;height:9px;border-radius:50%}
.th-card-bar .dot:nth-child(1){background:#f5a3c0}
.th-card-bar .dot:nth-child(2){background:#fbbf24}
.th-card-bar .dot:nth-child(3){background:#86c5a0}
.th-src{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:rgba(245,230,179,.55);margin-left:.6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-frame{flex:1;position:relative}
.th-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0c0a1a}
.th-bottom{padding:.7rem 1rem;border-top:1px solid rgba(212,168,87,.12);overflow-x:auto;display:flex;gap:.4rem}
.th-pill{
  padding:.4rem .7rem;border-radius:99px;font-size:.72rem;font-weight:600;
  color:rgba(245,230,179,.6);border:1px solid rgba(212,168,87,.2);white-space:nowrap;
  display:inline-flex;align-items:center;gap:.4rem;
}
.th-pill[data-active]{background:linear-gradient(135deg,#d4a857,#86c5a0);color:#04030a;border-color:transparent}
.th-versions a{font-size:.7rem;padding:.3rem .55rem;border-radius:.4rem;color:rgba(245,230,179,.6);border:1px solid rgba(212,168,87,.18);margin-left:.2rem}
.th-versions a[data-current]{background:#d4a857;color:#04030a;border-color:transparent}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>
<body data-i18n-page="read-webbook-v6">

<div class="th-shell">
  <header class="th-top">
    <a href="../index.html" class="inline-flex items-center gap-2">
      <span class="w-9 h-9" data-b-logo="master" data-b-size="36"></span>
      <span class="font-display font-bold">2030B · v6 Theatre</span>
    </a>
    <span class="text-xs uppercase tracking-[.18em] text-gold-300/55 hidden md:inline" id="thTitle">Open WebBook</span>
    <div class="th-versions">
      <a href="read-webbook.html">v1</a>
      <a href="read-webbook-v2.html">v2</a>
      <a href="read-webbook-v3.html">v3</a>
      <a href="read-webbook-v4.html">v4</a>
      <a href="read-webbook-v5.html">v5</a>
      <a href="read-webbook-v6.html" data-current>v6</a>
    </div>
  </header>

  <div class="th-stage">
    <div class="th-card">
      <div class="th-card-bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="th-src" id="thSrc"></span>
      </div>
      <div class="th-frame"><iframe id="thFrame"></iframe></div>
    </div>
  </div>

  <nav class="th-bottom" id="thNav"></nav>
</div>

<script src="../js/logos.js"></script>
<script src="../js/registry.js"></script>
<script>
(function(){
  const slug = new URLSearchParams(location.search).get('dept') || 'ontology';
  const dep = (window.B_REGISTRY||[]).find(x=>x.slug===slug);
  const src = `https://2030b.com/webbook/webbook-v6.html`;

  document.getElementById('thFrame').src = src;
  document.getElementById('thSrc').textContent = src;
  document.getElementById('thTitle').textContent = (dep?.name || 'WebBook') + ' · ' + (dep?.level || '');
  document.title = (dep?.name || 'WebBook') + ' · v6 Theatre';

  const nav = document.getElementById('thNav');
  nav.innerHTML = (window.B_REGISTRY||[]).map(d => `
    <a class="th-pill"${d.slug===slug?' data-active':''} href="?dept=${d.slug}">
      <span class="w-1.5 h-1.5 rounded-full" style="background:${d.color}"></span>
      ${d.name.replace(/^2030B /,'').replace(' Department','')}
    </a>
  `).join('');
})();
</script>
<script src="../js/i18n.js"></script>
<script src="../js/gsap-anim.js"></script>
</body>
</html>
