<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Read · v2 Focus · 2030B WebBook</title>
<meta name="author" content="Maher" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{ink:{900:'#08070f',950:'#04030a'},gold:{300:'#f5e6b3',400:'#fbbf24',500:'#d4a857'}},fontFamily:{sans:['Inter','sans-serif'],display:['Cormorant Garamond','serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css" />
<style>
/* v2 — FOCUS: minimal top tab-bar instead of side aside; iframe takes 95% */
html,body{background:#04030a;height:100%;margin:0;color:#f5e6b3}
.fc-shell{display:flex;flex-direction:column;height:100vh}
.fc-bar{
  display:flex;align-items:center;gap:1rem;
  padding:.55rem 1rem;border-bottom:1px solid rgba(212,168,87,.18);
  background:rgba(8,7,15,.85);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:5;
}
.fc-tabs{display:flex;gap:.25rem;flex:1;overflow-x:auto;scrollbar-width:none}
.fc-tabs::-webkit-scrollbar{display:none}
.fc-tab{
  padding:.4rem .75rem;border-radius:.4rem;font-size:.78rem;font-weight:600;
  color:rgba(245,230,179,.6);border:1px solid transparent;white-space:nowrap;
}
.fc-tab:hover{color:#fbbf24}
.fc-tab[data-active]{background:rgba(212,168,87,.12);color:#fbbf24;border-color:rgba(212,168,87,.3)}
.fc-versions a{font-size:.7rem;font-weight:600;padding:.3rem .55rem;border-radius:.4rem;color:rgba(245,230,179,.6);border:1px solid rgba(212,168,87,.18)}
.fc-versions a[data-current]{background:#d4a857;color:#04030a;border-color:transparent}
.fc-src{padding:.4rem 1rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:rgba(245,230,179,.5);background:#08070f;border-bottom:1px solid rgba(212,168,87,.18);overflow-x:auto;white-space:nowrap}
.fc-src a{color:#fbbf24}
.fc-frame{flex:1;position:relative}
.fc-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0c0a1a}
.fc-loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#04030a;z-index:2}
.fc-loader[data-hidden]{display:none}
</style>
</head>
<body>

<div class="fc-shell">
  <header class="fc-bar">
    <a href="../index.html" class="inline-flex items-center gap-2">
      <span class="w-8 h-8 inline-flex items-center justify-center" data-b-logo="master" data-b-size="32"></span>
      <span class="font-display font-bold text-sm hidden sm:inline">2030B · v2</span>
    </a>
    <nav class="fc-tabs" id="fcTabs"></nav>
    <div class="fc-versions hidden md:flex gap-1">
      <a href="read-webbook.html">v1</a>
      <a href="read-webbook-v2.html" data-current>v2</a>
      <a href="read-webbook-v3.html">v3</a>
      <a href="read-webbook-v4.html">v4</a>
      <a href="read-webbook-v5.html">v5</a>
      <a href="read-webbook-v6.html">v6</a>
    </div>
  </header>

  <div class="fc-src">
    Source: <a id="fcSrcA" href="#" target="_blank" rel="noopener"></a>
  </div>

  <div class="fc-frame">
    <div class="fc-loader" id="fcLoader">
      <div class="text-center">
        <div data-b-logo="master" data-b-size="100" class="inline-block"></div>
        <p class="mt-3 text-xs uppercase tracking-[.2em] text-gold-300/55">Focus mode loading…</p>
      </div>
    </div>
    <iframe id="fcFrame" title="WebBook content"></iframe>
  </div>
</div>

<script src="../js/logos.js"></script>
<script src="../js/registry.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('dept') || 'ontology';
  const src = `https://2030b.com/webbook/webbook-v6.html`;

  const tabs = document.getElementById('fcTabs');
  tabs.innerHTML = (window.B_REGISTRY||[]).map(d => `
    <a class="fc-tab${d.slug===slug?' ':''}"${d.slug===slug?' data-active':''} href="?dept=${d.slug}">${d.name.replace(/^2030B /,'').replace(' Department','')}</a>
  `).join('');

  document.title = ((window.B_REGISTRY||[]).find(x=>x.slug===slug)?.name || 'WebBook') + ' · v2 Focus';

  const f = document.getElementById('fcFrame'); f.src = src;
  document.getElementById('fcSrcA').textContent = src;
  document.getElementById('fcSrcA').href = src;

  const ld = document.getElementById('fcLoader');
  let done=false; const fin=()=>{if(done)return;done=true;ld.setAttribute('data-hidden','')};
  f.addEventListener('load', fin); setTimeout(fin, 4000);

  if (window.lucide) try { lucide.createIcons(); } catch(e){}
})();
</script>
</body>
</html>
