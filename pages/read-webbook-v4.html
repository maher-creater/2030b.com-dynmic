<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Read · v4 Split · 2030B WebBook</title>
<meta name="author" content="Maher" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{ink:{900:'#08070f',950:'#04030a'},gold:{300:'#f5e6b3',400:'#fbbf24',500:'#d4a857'}},fontFamily:{sans:['Inter','sans-serif'],display:['Cormorant Garamond','serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css" />
<style>
/* v4 — SPLIT: side-by-side comparison of two departments */
html,body{background:#04030a;height:100%;margin:0;color:#f5e6b3}
.sp-shell{display:flex;flex-direction:column;height:100vh}
.sp-top{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1rem;border-bottom:1px solid rgba(212,168,87,.18);background:rgba(8,7,15,.85);position:sticky;top:0;z-index:5}
.sp-versions a{font-size:.7rem;font-weight:600;padding:.3rem .55rem;border-radius:.4rem;color:rgba(245,230,179,.6);border:1px solid rgba(212,168,87,.18);margin-left:.2rem}
.sp-versions a[data-current]{background:#d4a857;color:#04030a;border-color:transparent}
.sp-grid{flex:1;display:grid;grid-template-columns:1fr 4px 1fr;min-height:0}
.sp-divider{background:rgba(212,168,87,.18)}
.sp-pane{display:flex;flex-direction:column;min-width:0}
.sp-pane-head{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;border-bottom:1px solid rgba(212,168,87,.18);background:#08070f}
.sp-pane-head select{background:#0c0a1a;color:#f5e6b3;border:1px solid rgba(212,168,87,.25);border-radius:.4rem;padding:.3rem .5rem;font-size:.75rem}
.sp-pane-head .sp-src{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:rgba(245,230,179,.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-frame{flex:1;position:relative}
.sp-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0c0a1a}
@media(max-width:900px){.sp-grid{grid-template-columns:1fr;grid-template-rows:1fr 4px 1fr}.sp-divider{height:4px;width:auto}}
</style>
</head>
<body>

<div class="sp-shell">
  <header class="sp-top">
    <a href="../index.html" class="inline-flex items-center gap-2">
      <span class="w-9 h-9" data-b-logo="master" data-b-size="36"></span>
      <span class="font-display font-bold">2030B · v4 Split</span>
    </a>
    <span class="hidden md:inline text-xs uppercase tracking-wider text-gold-300/55">Compare two department WebBooks side by side</span>
    <div class="sp-versions">
      <a href="read-webbook.html">v1</a>
      <a href="read-webbook-v2.html">v2</a>
      <a href="read-webbook-v3.html">v3</a>
      <a href="read-webbook-v4.html" data-current>v4</a>
      <a href="read-webbook-v5.html">v5</a>
      <a href="read-webbook-v6.html">v6</a>
    </div>
  </header>

  <div class="sp-grid">
    <section class="sp-pane">
      <div class="sp-pane-head">
        <i data-lucide="book-open" class="w-4 h-4 text-gold-400"></i>
        <select id="sp1Sel" class="sp-sel"></select>
        <span class="sp-src" id="sp1Src"></span>
      </div>
      <div class="sp-frame"><iframe id="sp1Frame"></iframe></div>
    </section>

    <div class="sp-divider"></div>

    <section class="sp-pane">
      <div class="sp-pane-head">
        <i data-lucide="book-open" class="w-4 h-4 text-gold-400"></i>
        <select id="sp2Sel" class="sp-sel"></select>
        <span class="sp-src" id="sp2Src"></span>
      </div>
      <div class="sp-frame"><iframe id="sp2Frame"></iframe></div>
    </section>
  </div>
</div>

<script src="../js/logos.js"></script>
<script src="../js/registry.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const a = params.get('a') || params.get('dept') || 'ontology';
  const b = params.get('b') || 'quantum-ethics';

  const opts = (window.B_REGISTRY||[]).map(d=>`<option value="${d.slug}">${d.name.replace(/^2030B /,'')}</option>`).join('');
  function bind(selId, frameId, srcId, current){
    const sel = document.getElementById(selId);
    sel.innerHTML = opts;
    sel.value = current;
    const url = `https://2030b.com/webbook/webbook-v6.html?dept=${current}`;
    document.getElementById(frameId).src = url;
    document.getElementById(srcId).textContent = url;
    sel.addEventListener('change', () => {
      const u = `https://2030b.com/webbook/webbook-v6.html?dept=${sel.value}`;
      document.getElementById(frameId).src = u;
      document.getElementById(srcId).textContent = u;
      const p = new URLSearchParams(location.search);
      if (selId==='sp1Sel') p.set('a', sel.value); else p.set('b', sel.value);
      history.replaceState(null,'','?'+p.toString());
    });
  }
  bind('sp1Sel','sp1Frame','sp1Src',a);
  bind('sp2Sel','sp2Frame','sp2Src',b);
  if (window.lucide) try { lucide.createIcons(); } catch(e){}
})();
</script>
</body>
</html>
