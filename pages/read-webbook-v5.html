<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Read · v5 Tabbed · 2030B WebBook</title>
<meta name="author" content="Maher" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{ink:{900:'#08070f',950:'#04030a'},gold:{300:'#f5e6b3',400:'#fbbf24',500:'#d4a857'}},fontFamily:{sans:['Inter','sans-serif'],display:['Cormorant Garamond','serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css" />
<style>
/* v5 — TABBED: open multiple WebBooks as browser-style tabs */
html,body{background:#04030a;height:100%;margin:0;color:#f5e6b3}
.tb-shell{display:flex;flex-direction:column;height:100vh}
.tb-bar{display:flex;align-items:center;gap:.4rem;padding:.4rem .8rem;border-bottom:1px solid rgba(212,168,87,.18);background:#0a0816;overflow-x:auto}
.tb-tab{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.45rem .7rem;border-radius:.5rem .5rem 0 0;
  font-size:.78rem;color:rgba(245,230,179,.7);
  background:#08070f;border:1px solid rgba(212,168,87,.18);border-bottom:none;
  white-space:nowrap;cursor:pointer;
}
.tb-tab[data-active]{background:#0c0a1a;color:#fbbf24;border-color:#d4a857}
.tb-tab .tb-x{margin-left:.4rem;opacity:.4}
.tb-tab .tb-x:hover{opacity:1;color:#f5a3c0}
.tb-add{
  width:32px;height:30px;border-radius:.4rem;display:inline-flex;align-items:center;justify-content:center;
  color:rgba(245,230,179,.6);border:1px dashed rgba(212,168,87,.3);
}
.tb-add:hover{color:#fbbf24;border-color:#d4a857}
.tb-versions{margin-left:auto;display:flex;gap:.2rem}
.tb-versions a{font-size:.7rem;padding:.3rem .55rem;border-radius:.4rem;color:rgba(245,230,179,.6);border:1px solid rgba(212,168,87,.18)}
.tb-versions a[data-current]{background:#d4a857;color:#04030a;border-color:transparent}
.tb-stage{flex:1;position:relative;background:#0c0a1a}
.tb-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#0c0a1a}
.tb-frame[data-active]{display:block}
.tb-src{padding:.4rem .8rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:rgba(245,230,179,.5);background:#08070f;border-bottom:1px solid rgba(212,168,87,.18);overflow-x:auto;white-space:nowrap}
.tb-src a{color:#fbbf24}
</style>
</head>
<body>

<div class="tb-shell">
  <header class="flex items-center justify-between px-3 py-2 border-b border-amber-200/15 bg-ink-900">
    <a href="../index.html" class="inline-flex items-center gap-2">
      <span class="w-8 h-8" data-b-logo="master" data-b-size="32"></span>
      <span class="font-display font-bold text-sm">2030B · v5 Tabbed</span>
    </a>
    <div class="tb-versions">
      <a href="read-webbook.html">v1</a>
      <a href="read-webbook-v2.html">v2</a>
      <a href="read-webbook-v3.html">v3</a>
      <a href="read-webbook-v4.html">v4</a>
      <a href="read-webbook-v5.html" data-current>v5</a>
      <a href="read-webbook-v6.html">v6</a>
    </div>
  </header>

  <div class="tb-bar" id="tbBar"></div>
  <div class="tb-src" id="tbSrc"></div>
  <div class="tb-stage" id="tbStage"></div>
</div>

<script src="../js/logos.js"></script>
<script src="../js/registry.js"></script>
<script>
(function(){
  const initial = (new URLSearchParams(location.search).get('depts') || 'ontology,quantum-ethics,neural-sovereignty').split(',').filter(Boolean);
  const open = [...new Set(initial)];

  function srcFor(slug){ return `https://2030b.com/webbook/webbook-v6.html?dept=${slug}`; }

  const bar = document.getElementById('tbBar');
  const stage = document.getElementById('tbStage');
  const srcLine = document.getElementById('tbSrc');

  function render(active){
    bar.innerHTML = open.map(s => {
      const d = (window.B_REGISTRY||[]).find(x=>x.slug===s);
      return `<button class="tb-tab" data-slug="${s}"${s===active?' data-active':''}>
        <span class="w-1.5 h-1.5 rounded-full" style="background:${d?.color||'#d4a857'}"></span>
        ${d?.name.replace(/^2030B /,'').replace(' Department','') || s}
        <span class="tb-x" data-close="${s}" title="Close">×</span>
      </button>`;
    }).join('') + `<button class="tb-add" id="tbAdd" title="Open another"><i data-lucide="plus" class="w-4 h-4"></i></button>`;

    stage.innerHTML = open.map(s => `<iframe class="tb-frame" data-slug="${s}"${s===active?' data-active':''} src="${srcFor(s)}"></iframe>`).join('');

    const url = srcFor(active);
    srcLine.innerHTML = `Source: <a href="${url}" target="_blank" rel="noopener">${url}</a>`;

    if (window.lucide) try { lucide.createIcons(); } catch(e){}
  }

  bar.addEventListener('click', e => {
    const close = e.target.closest('[data-close]');
    if (close) {
      e.stopPropagation();
      const s = close.dataset.close;
      const idx = open.indexOf(s);
      if (idx>=0 && open.length>1) {
        open.splice(idx,1);
        render(open[Math.min(idx, open.length-1)]);
      }
      return;
    }
    const tab = e.target.closest('.tb-tab');
    if (tab) render(tab.dataset.slug);
    if (e.target.closest('#tbAdd')) {
      const remaining = (window.B_REGISTRY||[]).map(d=>d.slug).filter(s=>!open.includes(s));
      const next = remaining[0]; if (!next) return;
      open.push(next); render(next);
    }
  });

  render(open[0]);
})();
</script>
</body>
</html>
